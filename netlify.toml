# yuusef.com — Netlify settings
[build]
  publish = "."

# Old Squarespace pages send visitors to the new site instead of a dead end
[[redirects]]
  from = "/the-vault"
  to = "/"
  status = 301
[[redirects]]
  from = "/the-vault/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/cart"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Report-only: logs anything outside this list to the browser console, blocks nothing. Switch the name to
    # "Content-Security-Policy" to enforce once it has run clean. Re-hash the inline boot script if it changes.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'sha256-UvY3IJIR2W0jdV32ZI1kwHnUcDLrEXfKlJr7LG7X+BA=' https://w.soundcloud.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://is1-ssl.mzstatic.com https://i1.sndcdn.com https://i.scdn.co; media-src 'self'; font-src 'self'; connect-src 'self' https://wave.sndcdn.com https://mdpmfgewfelvvumldtrh.supabase.co; frame-src https://w.soundcloud.com https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'"

# Fonts never change: cache for a year. Other assets: a week.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"
