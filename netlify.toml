# yuusef.com — Netlify settings
[build]
  publish = "."

# Old Squarespace pages send visitors to the new site instead of a dead end
[[redirects]]
  from = "/the-vault"
  to = "/"
  status = 301
[[redirects]]
  from = "/the-vault/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/cart"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fonts never change: cache for a year. Other assets: a week.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"
